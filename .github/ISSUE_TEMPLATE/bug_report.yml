name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Remove IP addresses, user names and passwords** from everything you paste.
        Security vulnerability? Do not open an issue, see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → About
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server OS
      placeholder: "Debian 12, Ubuntu 24.04…"
  - type: dropdown
    id: access
    attributes:
      label: Root access
      options: ["Direct root", "sudo", "su", "N/A"]
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error message or operation log
      render: text
