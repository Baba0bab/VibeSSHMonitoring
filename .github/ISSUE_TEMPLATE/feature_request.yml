name: Feature request / Idée
description: Suggest an improvement / Proposer une amélioration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve? / Quel problème cela résoudrait-il ?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution / Solution proposée
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / Alternatives envisagées
