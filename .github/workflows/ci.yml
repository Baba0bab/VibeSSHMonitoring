# Compilation et tests à chaque push sur main et à chaque pull request
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & tests (Windows)
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VibeSSHMonitoring.slnx

      - name: Build
        run: dotnet build VibeSSHMonitoring.slnx -c Release --no-restore

      # Les tests de scripts shell utilisent le sh de Git for Windows, présent sur les runners
      - name: Tests
        run: dotnet test Tests/VibeSSHMonitoring.Tests.csproj -c Release --no-build --logger trx --results-directory TestResults

      - name: Test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
